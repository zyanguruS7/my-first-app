<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ドットラン</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      background: #f4f4ef;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="450"></canvas>

  <script>
    // ===== 基本設定 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const WALL = 20;          // 上下の壁の厚さ
    const LEFT_WALL = 8;      // 左の壁の厚さ
    const TOP = WALL;         // 動ける範囲の上端
    const BOTTOM = H - WALL;  // 動ける範囲の下端
    const MID = (TOP + BOTTOM) / 2;    // 動ける範囲の上下の真ん中
    const HALF = (BOTTOM - TOP) / 2;   // 動ける範囲の高さの半分
    const DOT_R = 6;          // 黒い点の半径
    // 黒い点の速さ（すべて画面に対する速さ）
    const DOT_SPEED = 2.3;        // クリックしたときの速さ
    const DOT_SPEED_SLOW = 1.6; // 矢印キーで向きを変えたときの最初の速さ
    const DOT_SPEED_MAX = 4.2;  // 矢印キーで加速できる上限
    const HOLD_ACCEL = 0.022;    // 同じ向きのキーを押し続けたときの1フレームごとの加速
    const TAP_BOOST = 0.4;      // 同じ向きのキーをもう一度押したときの加速
    const COUNTDOWN = 180;      // スタート前のカウントダウン（60フレーム = 約1秒）

    // ===== ステージ =====
    //   patterns: 出てくる障害物（この順番で並ぶ。同じステージ内で重複なし）
    //   speed: 画面が進む速さ        anim: 障害物が動く・回る速さの倍率
    //   gap:   すき間の広さの倍率    space: 障害物どうしの間隔
    const STAGES = [
      { speed: 0.7, anim: 1.0,  gap: 1.0,  space: 230,
        patterns: [pillars, scatteredBlocks, zigzag] },
      { speed: 0.75, anim: 1.1,  gap: 0.97, space: 215,
        patterns: [tunnel, movingPillars, bouncingBlocks, spinningBar] },
      { speed: 0.8, anim: 1.2,  gap: 0.94, space: 200,
        patterns: [pendulum, orbit, shutter, pillars, spinningBar] },
      { speed: 0.85, anim: 1.3,  gap: 0.91, space: 185,
        patterns: [spinningCross, wave, conveyor, movingPillars, pendulum] },
      { speed: 0.9, anim: 1.4,  gap: 0.88, space: 170,
        patterns: [windmill, ring, pulsing, tunnel, orbit, shutter] },
      { speed: 0.95, anim: 1.5,  gap: 0.86, space: 160,
        patterns: [spinningTriangle, stars, gears, figureEight, zigzag, wave] },
      { speed: 1.0, anim: 1.6,  gap: 0.84, space: 150,
        patterns: [windmill, conveyor, spinningCross, ring, pulsing, movingPillars, stars] },
      { speed: 1.05, anim: 1.7,  gap: 0.82, space: 140,
        patterns: [gears, figureEight, tunnel, pendulum, spinningTriangle, shutter, wave] },
      { speed: 1.1, anim: 1.8,  gap: 0.8,  space: 130,
        patterns: [ring, windmill, conveyor, stars, orbit, bouncingBlocks, spinningCross, pulsing] },
      // 最終ステージ：半分まで進むと、後ろから飛行船が追いかけてきてレーザーを撃つ（ship: true）
      { speed: 1.15, anim: 1.9,  gap: 0.78, space: 120, ship: true,
        patterns: [figureEight, gears, shutter, windmill, wave, ring, pendulum, conveyor, tunnel] },
    ];

    // ===== 飛行船（最終ステージ） =====
    const SHIP_START = 0.5;    // ステージのどこまで進んだら現れるか（0.5 = 半分）
    const SHIP_X = 75;         // 画面の左から何ピクセルの所にとどまるか（中心）
    const SHIP_RX = 46;        // 船体（だ円）の横の半径
    const SHIP_RY = 20;        // 船体（だ円）の縦の半径
    const SHIP_ENTER = 100;    // 画面の外から入ってくるのにかかるフレーム数
    const SHIP_FOLLOW = 1.2;   // 点を追いかけて上下に動く速さ
    const SHIP_COOL = 80;      // レーザーを撃ってから次のねらいを始めるまで
    const SHIP_AIM = 55;       // ねらいを付けている時間（予告線が出る）
    const SHIP_LOCK = 20;      // ねらいの最後のこのフレーム数は向きが固定される
    const LASER_SPEED = 8;     // レーザーの速さ
    const LASER_LEN = 46;      // レーザーの長さ

    // ===== ゲームの状態 =====
    let state = "title"; // "title" / "select" / "playing" / "gameover" / "clear"
    let dot, camX, scrollSpeed, obstacles, t, waitTimer;
    let stageIndex = 0, goalX;
    let gapScale = 1; // 今のステージのすき間の広さの倍率
    let countdown = 0, goTimer = 0; // スタート前のカウントダウンと「GO!」の表示時間
    // 飛行船とレーザー（どちらも画面上の座標で動かす）
    //   ship.mode: "waiting"（まだ来ていない）/ "entering"（入ってくる途中）/ "cool"（休み）/ "aim"（ねらい中）
    let ship, lasers;
    let pointerDown = false;
    // クリアしたステージの記録（ページを閉じても残る）
    let cleared = JSON.parse(localStorage.getItem("dotRunCleared") || "[]");
    const isUnlocked = (i) => i === 0 || cleared[i - 1];

    function startStage(i) {
      stageIndex = i;
      const stage = STAGES[i];
      gapScale = stage.gap;
      // ステージの障害物を最初に全部並べる
      // 障害物ごとに乱数の種を固定しているので、何度やり直しても同じ配置になる
      obstacles = [];
      let x = W + 100;
      stage.patterns.forEach((pattern, k) => {
        seed = (i + 1) * 1000 + k * 7919;
        const p = pattern(x);
        obstacles.push(...p.list);
        x += p.width + stage.space;
      });
      goalX = x + 100; // 最後の障害物のあとにゴール
      // vx, vy は画面に対する速度。最初のクリックまでは画面と一緒に流れるだけ
      // speed は今の速さ。vx, vy は向き × 速さ
      dot = { x: 200, y: H / 2, vx: 0, vy: 0, speed: 0 };
      keyDir = null;
      camX = 0;
      scrollSpeed = stage.speed;
      t = 0;
      for (const o of obstacles) Object.assign(o, o.pose(0)); // カウントダウン中の表示用
      ship = { mode: "waiting", x: -SHIP_RX * 2, y: MID, timer: 0, angle: 0, warn: 0 };
      lasers = [];
      // 3, 2, 1 のカウントダウンから始める
      countdown = COUNTDOWN;
      goTimer = 0;
      state = "countdown";
    }

    // ===== 入力（クリック・ドラッグ・タッチ） =====
    // 画面上の座標をキャンバス内の座標に変換する
    function toCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height),
      };
    }

    // クリックした方向へ進む向きを変える（止まらずに等速で進み続ける）
    function setTarget(e) {
      const p = toCanvasPos(e);
      const dx = p.x - (dot.x - camX);
      const dy = p.y - dot.y;
      const len = Math.hypot(dx, dy);
      if (len < 1) return; // 点そのものをクリックしたときは向きを変えない
      dot.speed = DOT_SPEED;
      dot.vx = (dx / len) * DOT_SPEED;
      dot.vy = (dy / len) * DOT_SPEED;
      keyDir = null; // クリックしたら矢印キーでの加速はリセット
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (state === "playing") {
        pointerDown = true;
        setTarget(e);
        return;
      }
      if (state === "title") { state = "select"; return; }
      // それ以外の画面ではボタンを押したか調べる
      const p = toCanvasPos(e);
      for (const b of getButtons()) {
        if (b.enabled && p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
          b.onClick();
          return;
        }
      }
    });
    canvas.addEventListener("pointermove", (e) => {
      // 押したままドラッグすると目的地を更新し続ける
      if (pointerDown && state === "playing") setTarget(e);
    });
    window.addEventListener("pointerup", () => { pointerDown = false; });

    // 矢印キーで向きを変える（2つ同時押しでななめ。キーを離しても進み続ける）
    // 新しい向きはゆっくりから始まり、同じ向きを押し続ける・何度も押すとだんだん速くなる
    const ARROWS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    };
    const heldArrows = new Set();
    let keyDir = null; // 矢印キーで今進んでいる向き（"1,0" のような文字列）

    // 押されている矢印キーを合わせた向きを返す（向きが決まらないときは null）
    function heldDirection() {
      let dx = 0, dy = 0;
      for (const code of heldArrows) {
        dx += ARROWS[code][0];
        dy += ARROWS[code][1];
      }
      const len = Math.hypot(dx, dy);
      if (len === 0) return null; // 何も押していない・上と下を同時に押したときなど
      return { ux: dx / len, uy: dy / len, key: `${dx},${dy}` };
    }

    // 速さを変えて、今の向きのまま速度に反映する
    function setSpeed(dir, speed) {
      dot.speed = Math.min(DOT_SPEED_MAX, speed);
      dot.vx = dir.ux * dot.speed;
      dot.vy = dir.uy * dot.speed;
    }
    document.addEventListener("keydown", (e) => {
      // Enterキーで「リトライ」「次のステージへ」などの最初のボタンを押す
      if (e.code === "Enter" || e.code === "NumpadEnter") {
        if (state === "title") state = "select";
        else if (state === "gameover" || state === "clear") {
          const b = getButtons()[0];
          if (b && b.enabled) b.onClick();
        }
        return;
      }
      if (!ARROWS[e.code]) return;
      e.preventDefault(); // 矢印キーでページがスクロールしないようにする
      if (e.repeat) return; // 押しっぱなしの加速は update() で行う
      heldArrows.add(e.code);
      if (state !== "playing") return;
      const dir = heldDirection();
      if (!dir) return;
      // 同じ向きをもう一度押したら加速、違う向きならゆっくりから
      setSpeed(dir, dir.key === keyDir ? dot.speed + TAP_BOOST : DOT_SPEED_SLOW);
      keyDir = dir.key;
    });
    document.addEventListener("keyup", (e) => { heldArrows.delete(e.code); });
    window.addEventListener("blur", () => heldArrows.clear());

    // ===== 便利関数 =====
    // 種（seed）が同じなら毎回同じ並びになる乱数
    let seed = 1;
    function random() {
      seed = (seed + 0x6d2b79f5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    }
    const rand = (a, b) => a + random() * (b - a);
    const pick = (arr) => arr[Math.floor(random() * arr.length)];

    // 障害物を作る
    //   shape: "rect"（長方形）か "circle"（円）
    //   pose(t): 時刻 t のときの位置 {x, y} と回転角 a を返す関数
    function rect(w, h, pose, endX) {
      return { shape: "rect", w, h, pose, endX };
    }
    function circle(r, pose, endX) {
      return { shape: "circle", r, pose, endX };
    }
    // 多角形（points は中心から見た頂点の座標 [[x, y], ...]）
    function poly(points, pose, endX) {
      return { shape: "poly", points, pose, endX };
    }
    // 中心から半径 radii を順番に使って頂点を作る（三角形や星形用）
    function radialPoints(count, radii) {
      return Array.from({ length: count }, (_, i) => {
        const a = (Math.PI * 2 * i) / count - Math.PI / 2;
        const r = radii[i % radii.length];
        return [Math.cos(a) * r, Math.sin(a) * r];
      });
    }

    // ===== 障害物のパターン =====
    // 各パターンは開始位置 x を受け取り、{ list: 障害物の配列, width: パターンの幅 } を返す

    // 1. 上下の柱（すき間を通る）
    function pillars(x) {
      const gap = rand(120, 160) * gapScale;
      const gapTop = rand(TOP + 30, BOTTOM - 30 - gap);
      const end = x + 40;
      return {
        width: 40,
        list: [
          rect(40, H, () => ({ x, y: gapTop - H / 2, a: 0 }), end),
          rect(40, H, () => ({ x, y: gapTop + gap + H / 2, a: 0 }), end),
        ],
      };
    }

    // 2. 上下に動く柱
    function movingPillars(x) {
      const gap = 140 * gapScale;
      const amp = rand(50, 90);
      const center = rand(TOP + gap / 2 + amp + 10, BOTTOM - gap / 2 - amp - 10);
      const speed = rand(0.02, 0.035);
      const phase = rand(0, Math.PI * 2);
      const end = x + 40;
      const gapY = (t) => center + Math.sin(t * speed + phase) * amp;
      return {
        width: 40,
        list: [
          rect(40, H, (t) => ({ x, y: gapY(t) - gap / 2 - H / 2, a: 0 }), end),
          rect(40, H, (t) => ({ x, y: gapY(t) + gap / 2 + H / 2, a: 0 }), end),
        ],
      };
    }

    // 3. 回転する棒（縦になると上の壁から下の壁までふさぐ。横になったすきに通る）
    function spinningBar(x) {
      const len = HALF * 2;
      const cx = x + HALF;
      const spin = pick([-1, 1]) * rand(0.006, 0.009);
      const phase = rand(0, Math.PI);
      return {
        width: len,
        list: [rect(len, 20, (t) => ({ x: cx, y: MID, a: t * spin + phase }), x + len)],
      };
    }

    // 4. 回転する十字（腕の先が上下の壁まで届く）
    function spinningCross(x) {
      const len = HALF * 2;
      const cx = x + HALF;
      const spin = pick([-1, 1]) * rand(0.005, 0.008);
      const phase = rand(0, Math.PI / 2);
      return {
        width: len,
        list: [
          rect(len, 18, (t) => ({ x: cx, y: MID, a: t * spin + phase }), x + len),
          rect(len, 18, (t) => ({ x: cx, y: MID, a: t * spin + phase + Math.PI / 2 }), x + len),
        ],
      };
    }

    // 5. ぐるぐる回る玉（玉が上下の壁すれすれを回る）
    function orbit(x) {
      const ballR = 20;
      const R = HALF - ballR;
      const cx = x + HALF;
      const speed = pick([-1, 1]) * rand(0.008, 0.012);
      const n = pick([3, 4, 5]);
      const end = x + HALF * 2;
      const list = [circle(14, () => ({ x: cx, y: MID, a: 0 }), end)];
      for (let i = 0; i < n; i++) {
        const offset = (Math.PI * 2 * i) / n;
        list.push(circle(ballR, (t) => ({
          x: cx + Math.cos(t * speed + offset) * R,
          y: MID + Math.sin(t * speed + offset) * R,
          a: 0,
        }), end));
      }
      return { width: HALF * 2, list };
    }

    // 6. 振り子（天井または床からぶら下がる）
    function pendulum(x) {
      const fromTop = random() < 0.5;
      const pivotY = fromTop ? TOP : BOTTOM;
      const dir = fromTop ? 1 : -1;
      const len = rand(200, 270);
      const swing = rand(0.7, 1.0);
      const speed = rand(0.025, 0.04);
      const phase = rand(0, Math.PI * 2);
      const angle = (t) => Math.sin(t * speed + phase) * swing;
      const end = x + len;
      return {
        width: len,
        list: [
          // 棒
          rect(10, len, (t) => {
            const a = angle(t);
            return {
              x: x + len / 2 - Math.sin(a) * (len / 2) * dir,
              y: pivotY + Math.cos(a) * (len / 2) * dir,
              a,
            };
          }, end),
          // 先端のおもり
          circle(22, (t) => {
            const a = angle(t);
            return {
              x: x + len / 2 - Math.sin(a) * len * dir,
              y: pivotY + Math.cos(a) * len * dir,
              a: 0,
            };
          }, end),
        ],
      };
    }

    // 7. 散らばったブロック（ゆっくり回るものもある）
    function scatteredBlocks(x) {
      const list = [];
      const width = 260;
      const count = Math.floor(rand(3, 5));
      for (let i = 0; i < count; i++) {
        const size = rand(28, 60);
        const bx = x + (width / count) * i + size / 2;
        const by = rand(TOP + size, BOTTOM - size);
        const spin = random() < 0.5 ? rand(-0.03, 0.03) : 0;
        list.push(rect(size, size, (t) => ({ x: bx, y: by, a: t * spin }), x + width));
      }
      return { width, list };
    }

    // 8. 上下に往復するブロックの列
    function bouncingBlocks(x) {
      const list = [];
      const count = pick([2, 3]);
      const size = 46;
      const amp = (BOTTOM - TOP) / 2 - size / 2 - 5;
      const center = (TOP + BOTTOM) / 2;
      const speed = rand(0.025, 0.04);
      const width = count * 100;
      for (let i = 0; i < count; i++) {
        const phase = i * Math.PI * 0.6;
        list.push(rect(size, size, (t) => ({
          x: x + i * 100 + size / 2,
          y: center + Math.sin(t * speed + phase) * amp,
          a: 0,
        }), x + width));
      }
      return { width, list };
    }

    // 9. 細い通路（上下からトゲのように突き出たブロック）
    function zigzag(x) {
      const list = [];
      const count = 4;
      const step = 80;
      for (let i = 0; i < count; i++) {
        const fromTop = i % 2 === 0;
        const len = rand(170, 230);
        const bx = x + i * step + 15;
        const by = fromTop ? TOP + len / 2 : BOTTOM - len / 2;
        list.push(rect(30, len, () => ({ x: bx, y: by, a: 0 }), x + count * step));
      }
      return { width: count * step, list };
    }

    // 10. 回転する三角形
    function spinningTriangle(x) {
      const R = rand(70, 100);
      const cx = x + R;
      const cy = rand(TOP + R, BOTTOM - R);
      const spin = pick([-1, 1]) * rand(0.015, 0.03);
      return {
        width: R * 2,
        list: [poly(radialPoints(3, [R]), (t) => ({ x: cx, y: cy, a: t * spin }), x + R * 2)],
      };
    }

    // 11. 風車（中心から3枚の羽が伸びて回る。羽の先は上下の壁まで届く）
    function windmill(x) {
      const len = HALF;
      const n = 3;
      const cx = x + len;
      const spin = pick([-1, 1]) * rand(0.005, 0.008);
      const phase = rand(0, Math.PI * 2);
      const end = x + len * 2;
      const list = [circle(20, () => ({ x: cx, y: MID, a: 0 }), end)];
      for (let i = 0; i < n; i++) {
        const offset = (Math.PI * 2 * i) / n + phase;
        list.push(rect(len, 18, (t) => {
          const a = t * spin + offset;
          return { x: cx + Math.cos(a) * len / 2, y: MID + Math.sin(a) * len / 2, a };
        }, end));
      }
      return { width: len * 2, list };
    }

    // 12. 回りながら上下に動く星
    function stars(x) {
      const count = pick([2, 3]);
      const step = 130;
      const amp = (BOTTOM - TOP) / 2 - 50;
      const center = (TOP + BOTTOM) / 2;
      const speed = rand(0.02, 0.03);
      const width = (count - 1) * step + 80;
      const list = [];
      for (let i = 0; i < count; i++) {
        const sx = x + 40 + i * step;
        const phase = i * Math.PI;
        list.push(poly(radialPoints(10, [40, 17]), (t) => ({
          x: sx,
          y: center + Math.sin(t * speed + phase) * amp,
          a: t * 0.05,
        }), x + width));
      }
      return { width, list };
    }

    // 13. 歯車のように逆回転する2本の棒（どちらも上下の壁まで届く）
    //     2本の間には、点が待てるすき間（rest）を空けておく
    function gears(x) {
      const len = HALF * 2;
      const rest = 90;
      const spin = rand(0.006, 0.009);
      const phase = rand(0, Math.PI);
      const width = len * 2 + rest;
      const end = x + width;
      return {
        width,
        list: [
          rect(len, 18, (t) => ({ x: x + HALF, y: MID, a: t * spin + phase }), end),
          rect(len, 18, (t) => ({ x: x + len + rest + HALF, y: MID, a: -t * spin - phase + Math.PI / 2 }), end),
        ],
      };
    }

    // 14. 波のようにうねる玉の列
    function wave(x) {
      const count = 7;
      const step = 45;
      const amp = rand(110, 150);
      const center = (TOP + BOTTOM) / 2;
      const speed = rand(0.03, 0.045);
      const width = (count - 1) * step + 24;
      const list = [];
      for (let i = 0; i < count; i++) {
        list.push(circle(12, (t) => ({
          x: x + 12 + i * step,
          y: center + Math.sin(t * speed + i * 0.6) * amp,
          a: 0,
        }), x + width));
      }
      return { width, list };
    }

    // 15. 開いたり閉じたりするシャッター
    function shutter(x) {
      const cy = rand(TOP + 130, BOTTOM - 130);
      const speed = rand(0.025, 0.035);
      const phase = rand(0, Math.PI * 2);
      const open = 100 * gapScale;
      const gapHalf = (t) => 15 + Math.max(0, Math.sin(t * speed + phase)) * open;
      const end = x + 40;
      return {
        width: 40,
        list: [
          rect(40, H, (t) => ({ x, y: cy - gapHalf(t) - H / 2, a: 0 }), end),
          rect(40, H, (t) => ({ x, y: cy + gapHalf(t) + H / 2, a: 0 }), end),
        ],
      };
    }

    // 16. すき間のある回転リング（上下の壁まで届く大きな輪）
    //     向かい合う2か所に入り口があり、入り口が左右に来たときに通りぬけられる
    function ring(x) {
      const ballR = 16;
      const R = HALF - ballR;
      const slots = 30; // 玉どうしのすき間は点より狭いので、入り口以外は通れない
      const gapStart = Math.floor(rand(0, slots));
      const cx = x + HALF;
      const spin = pick([-1, 1]) * rand(0.006, 0.009);
      const end = x + HALF * 2;
      const list = [];
      for (let i = 0; i < slots; i++) {
        // 向かい合う2か所で、3つ分ずつ玉を抜いて入り口を作る
        if ((i - gapStart + slots) % (slots / 2) < 3) continue;
        const offset = (Math.PI * 2 * i) / slots;
        list.push(circle(ballR, (t) => ({
          x: cx + Math.cos(t * spin + offset) * R,
          y: MID + Math.sin(t * spin + offset) * R,
          a: 0,
        }), end));
      }
      return { width: HALF * 2, list };
    }

    // 17. ベルトコンベア（上下に流れ続けるブロックの列）
    function conveyor(x) {
      const size = 40;
      const perColumn = 3;
      const range = BOTTOM - TOP + size;
      const spacing = range / perColumn;
      const speed = rand(1.2, 2);
      const columns = 2;
      const width = (columns - 1) * 120 + size;
      const list = [];
      for (let c = 0; c < columns; c++) {
        const dir = c % 2 === 0 ? 1 : -1; // 列ごとに流れる向きを逆にする
        const bx = x + size / 2 + c * 120;
        for (let i = 0; i < perColumn; i++) {
          list.push(rect(size, size, (t) => {
            const pos = (((t * speed * dir + i * spacing) % range) + range) % range;
            return { x: bx, y: TOP - size / 2 + pos, a: 0 };
          }, x + width));
        }
      }
      return { width, list };
    }

    // 18. 8の字を描いて飛び回るブロック
    function figureEight(x) {
      const cx = x + 90;
      const center = (TOP + BOTTOM) / 2;
      const speed = rand(0.02, 0.03);
      const phase = rand(0, Math.PI * 2);
      return {
        width: 180,
        list: [rect(46, 46, (t) => ({
          x: cx + Math.sin((t * speed + phase) * 2) * 60,
          y: center + Math.sin(t * speed + phase) * 150,
          a: t * 0.04,
        }), x + 180)],
      };
    }

    // 19. ふくらんだり縮んだりする玉
    function pulsing(x) {
      const count = 3;
      const step = 110;
      const speed = rand(0.03, 0.045);
      const width = (count - 1) * step + 130;
      const list = [];
      for (let i = 0; i < count; i++) {
        const bx = x + 65 + i * step;
        const by = i % 2 === 0 ? TOP + 120 : BOTTOM - 120;
        list.push(circle(20, (t) => ({
          x: bx,
          y: by,
          a: 0,
          r: 20 + (Math.sin(t * speed + i * 1.5) + 1) / 2 * 45,
        }), x + width));
      }
      return { width, list };
    }

    // 20. くねくね曲がったトンネル
    function tunnel(x) {
      const segments = 8;
      const segW = 40;
      const gap = 190 * gapScale;
      const phase = rand(0, Math.PI * 2);
      const mid = (TOP + BOTTOM) / 2;
      const end = x + segments * segW;
      const list = [];
      for (let i = 0; i < segments; i++) {
        // 段差がきつくなりすぎないよう、1段ごとの上下のずれを小さめにする
        const cy = mid + Math.sin(i * 0.55 + phase) * 110;
        const sx = x + segW / 2 + i * segW;
        list.push(rect(segW + 1, H, () => ({ x: sx, y: cy - gap / 2 - H / 2, a: 0 }), end));
        list.push(rect(segW + 1, H, () => ({ x: sx, y: cy + gap / 2 + H / 2, a: 0 }), end));
      }
      return { width: segments * segW, list };
    }

    // ===== 当たり判定 =====
    function hits(o, px, py, r) {
      if (o.shape === "circle") {
        return Math.hypot(px - o.x, py - o.y) < o.r + r;
      }
      // 点を障害物の向きに合わせて回転させ、障害物から見た座標 (lx, ly) にする
      const dx = px - o.x;
      const dy = py - o.y;
      const cos = Math.cos(-o.a);
      const sin = Math.sin(-o.a);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      if (o.shape === "poly") return hitsPoly(o.points, lx, ly, r);
      // 回転した長方形
      const cx = Math.max(-o.w / 2, Math.min(o.w / 2, lx));
      const cy = Math.max(-o.h / 2, Math.min(o.h / 2, ly));
      return Math.hypot(lx - cx, ly - cy) < r;
    }

    // 多角形との当たり判定：中に入っているか、どれかの辺に近すぎたら当たり
    function hitsPoly(points, px, py, r) {
      let inside = false;
      for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[j];
        if ((y1 > py) !== (y2 > py) && px < ((x2 - x1) * (py - y1)) / (y2 - y1) + x1) {
          inside = !inside;
        }
        // 辺 (x1,y1)-(x2,y2) と点の距離
        const ex = x2 - x1, ey = y2 - y1;
        const k = Math.max(0, Math.min(1, ((px - x1) * ex + (py - y1) * ey) / (ex * ex + ey * ey)));
        if (Math.hypot(px - (x1 + ex * k), py - (y1 + ey * k)) < r) return true;
      }
      return inside;
    }

    // ===== 更新処理 =====
    function update() {
      if (state === "gameover" || state === "clear") { waitTimer--; return; }
      if (state === "countdown") {
        countdown--;
        if (countdown <= 0) {
          state = "playing";
          goTimer = 45;
        }
        return;
      }
      if (state !== "playing") return;
      t++;
      if (goTimer > 0) goTimer--;

      // 今の向きのキーを押し続けている間はだんだん速くなる
      const held = heldDirection();
      if (held && held.key === keyDir) setSpeed(held, dot.speed + HOLD_ACCEL);

      // 画面を右へ進める
      camX += scrollSpeed;

      // 黒い点を等速直線運動させる
      // 速度は「画面から見た速さ」なので、画面のスクロール分も一緒に進める。
      // こうすると画面上では上下左右どの向きにも同じ速さでまっすぐ進む
      dot.x += dot.vx + scrollSpeed;
      dot.y += dot.vy;

      // 障害物の位置を更新し（ステージが進むほど速く動く）、画面外に出たものを消す
      const anim = STAGES[stageIndex].anim;
      for (const o of obstacles) Object.assign(o, o.pose(t * anim));
      obstacles = obstacles.filter((o) => o.endX > camX - 100);

      // 壁との当たり判定（上・下・左）
      const screenX = dot.x - camX;
      if (dot.y - DOT_R < TOP || dot.y + DOT_R > BOTTOM || screenX - DOT_R < LEFT_WALL) {
        gameOver();
        return;
      }
      // 障害物との当たり判定
      for (const o of obstacles) {
        if (hits(o, dot.x, dot.y, DOT_R)) { gameOver(); return; }
      }
      // 飛行船とレーザー（最終ステージだけ）
      if (STAGES[stageIndex].ship && updateShip()) { gameOver(); return; }

      // ゴールテープを通りすぎたらクリア
      if (dot.x - DOT_R > goalX + 20) {
        state = "clear";
        waitTimer = 40;
        cleared[stageIndex] = true;
        localStorage.setItem("dotRunCleared", JSON.stringify(cleared));
      }
    }

    // 飛行船を動かしてレーザーを撃つ。点が飛行船かレーザーに当たったら true を返す
    function updateShip() {
      const sx = dot.x - camX; // 点の画面上の位置
      const sy = dot.y;

      if (ship.mode === "waiting") {
        // ステージの半分まで進んだら、まず「Warning」を出す
        if (camX >= (goalX - 200) * SHIP_START) {
          ship.mode = "warning";
          ship.timer = 0;
        }
        return false;
      }
      ship.timer++;
      if (ship.mode === "warning") {
        if (ship.timer >= 60) { ship.mode = "entering"; ship.timer = 0; }
        return false;
      }
      if (ship.mode === "entering") {
        // 画面の左の外から、だんだんゆっくりになりながら入ってくる
        const p = Math.min(1, ship.timer / SHIP_ENTER);
        const ease = 1 - (1 - p) * (1 - p);
        ship.x = -SHIP_RX * 2 + (SHIP_X + SHIP_RX * 2) * ease;
        if (p >= 1) { ship.mode = "cool"; ship.timer = 0; }
      } else {
        // ねらいが固定されている間以外は、点の高さに合わせて上下に追いかける
        const locked = ship.mode === "aim" && ship.timer > SHIP_AIM - SHIP_LOCK;
        if (!locked) {
          ship.y += Math.max(-SHIP_FOLLOW, Math.min(SHIP_FOLLOW, sy - ship.y));
          ship.y = Math.max(TOP + SHIP_RY + 5, Math.min(BOTTOM - SHIP_RY - 5, ship.y));
        }
        const gunX = ship.x + SHIP_RX;
        if (ship.mode === "cool" && ship.timer >= SHIP_COOL) {
          ship.mode = "aim";
          ship.timer = 0;
        } else if (ship.mode === "aim") {
          if (!locked) ship.angle = Math.atan2(sy - ship.y, sx - gunX);
          if (ship.timer >= SHIP_AIM) {
            // 発射！
            lasers.push({
              x: gunX, y: ship.y,
              ux: Math.cos(ship.angle), uy: Math.sin(ship.angle),
            });
            ship.mode = "cool";
            ship.timer = 0;
          }
        }
      }

      // レーザーを進め、画面の外に出たものを消す
      for (const l of lasers) {
        l.x += l.ux * LASER_SPEED;
        l.y += l.uy * LASER_SPEED;
      }
      lasers = lasers.filter((l) => l.x > -60 && l.x < W + 60 && l.y > -60 && l.y < H + 60);

      // 飛行船との当たり判定（だ円を点の半径の分だけ大きくして判定）
      const ex = (sx - ship.x) / (SHIP_RX + DOT_R);
      const ey = (sy - ship.y) / (SHIP_RY + DOT_R);
      if (ex * ex + ey * ey < 1) return true;

      // レーザーとの当たり判定（レーザーは線分なので、線分と点の距離を調べる）
      for (const l of lasers) {
        const bx = l.x - l.ux * LASER_LEN, by = l.y - l.uy * LASER_LEN;
        const k = Math.max(0, Math.min(LASER_LEN, (sx - bx) * l.ux + (sy - by) * l.uy));
        if (Math.hypot(sx - (bx + l.ux * k), sy - (by + l.uy * k)) < DOT_R + 2) return true;
      }
      return false;
    }

    // 飛行船・予告線・レーザー・Warning の表示（画面上の座標で描く）
    function drawShip() {
      if (!STAGES[stageIndex].ship || ship.mode === "waiting") return;

      // Warning（点滅）
      if (ship.mode === "warning" || ship.mode === "entering") {
        if (Math.floor(ship.timer / 10) % 2 === 0) {
          ctx.fillStyle = "#d33";
          ctx.font = "bold 40px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Warning", W / 2, 80);
        }
        if (ship.mode === "warning") return;
      }

      // ねらいの予告線（向きが固定されると速く点滅する）
      if (ship.mode === "aim") {
        const locked = ship.timer > SHIP_AIM - SHIP_LOCK;
        ctx.strokeStyle = locked && t % 6 < 3 ? "rgba(221, 51, 51, 0.9)" : "rgba(221, 51, 51, 0.35)";
        ctx.lineWidth = locked ? 2 : 1;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(ship.x + SHIP_RX, ship.y);
        ctx.lineTo(ship.x + SHIP_RX + Math.cos(ship.angle) * 1000, ship.y + Math.sin(ship.angle) * 1000);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // レーザー
      ctx.strokeStyle = "#d33";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      for (const l of lasers) {
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.ux * LASER_LEN, l.y - l.uy * LASER_LEN);
        ctx.stroke();
      }
      ctx.lineCap = "butt";

      // 飛行船（黒いだ円の船体＋後ろの羽＋前の赤い砲台）
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.moveTo(ship.x - SHIP_RX + 6, ship.y - 6);
      ctx.lineTo(ship.x - SHIP_RX - 10, ship.y - SHIP_RY - 6);
      ctx.lineTo(ship.x - SHIP_RX + 22, ship.y - 8);
      ctx.moveTo(ship.x - SHIP_RX + 6, ship.y + 6);
      ctx.lineTo(ship.x - SHIP_RX - 10, ship.y + SHIP_RY + 6);
      ctx.lineTo(ship.x - SHIP_RX + 22, ship.y + 8);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(ship.x, ship.y, SHIP_RX, SHIP_RY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d33";
      ctx.beginPath();
      ctx.arc(ship.x + SHIP_RX - 10, ship.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameOver() {
      state = "gameover";
      waitTimer = 40; // すぐにボタンが押されないよう少し待つ
    }

    // ===== ボタン =====
    // 今の画面に表示するボタンの一覧を返す（描画とクリック判定の両方で使う）
    function getButtons() {
      const ready = waitTimer <= 0;
      const toSelect = { label: "ステージ選択", onClick: () => { state = "select"; } };
      if (state === "select") {
        // 5列×2段のステージボタン
        return STAGES.map((_, i) => ({
          x: 125 + (i % 5) * 115,
          y: 150 + Math.floor(i / 5) * 115,
          w: 90,
          h: 90,
          label: String(i + 1),
          big: true,
          cleared: cleared[i],
          enabled: isUnlocked(i),
          onClick: () => startStage(i),
        }));
      }
      let list = [];
      if (state === "gameover") {
        list = [{ label: "リトライ", onClick: () => startStage(stageIndex) }, toSelect];
      } else if (state === "clear") {
        list = stageIndex < STAGES.length - 1
          ? [{ label: "次のステージへ", onClick: () => startStage(stageIndex + 1) }, toSelect]
          : [toSelect];
      }
      // 横に並べて中央寄せする
      const w = 180, h = 46, gap = 20;
      const startX = (W - (list.length * w + (list.length - 1) * gap)) / 2;
      return list.map((b, i) => ({ ...b, x: startX + i * (w + gap), y: H / 2 + 50, w, h, enabled: ready }));
    }

    function drawButtons() {
      for (const b of getButtons()) {
        ctx.fillStyle = b.enabled ? "#000" : "#bbb";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "#f4f4ef";
        ctx.font = `bold ${b.big ? 36 : 18}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + (b.cleared ? -8 : 0));
        if (b.cleared) {
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("CLEAR", b.x + b.w / 2, b.y + b.h - 16);
        }
        ctx.textBaseline = "alphabetic";
      }
    }

    // ゴールテープ（白黒のチェック模様）
    function drawGoal() {
      const size = 10;
      for (let y = TOP; y < BOTTOM; y += size) {
        for (let i = 0; i < 2; i++) {
          ctx.fillStyle = (Math.floor((y - TOP) / size) + i) % 2 === 0 ? "#000" : "#fff";
          ctx.fillRect(goalX + i * size, y, size, Math.min(size, BOTTOM - y));
        }
      }
      ctx.fillStyle = "#000";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("GOAL", goalX + 28, H / 2 + 7);
    }

    // ===== 描画処理 =====
    function draw() {
      ctx.fillStyle = "#f4f4ef";
      ctx.fillRect(0, 0, W, H);

      if (state === "title") {
        drawWalls();
        drawText("ドットラン", 48, H / 2 - 50);
        drawText("クリックした方向か矢印キーの方向へ、黒い点がまっすぐ進み続けます", 16, H / 2 + 5);
        drawText("黒いものと壁に当たったらゲームオーバー", 16, H / 2 + 30);
        drawText("右のゴールテープを通りぬけたらクリア", 16, H / 2 + 55);
        drawText("クリックでスタート", 22, H / 2 + 110);
        return;
      }

      if (state === "select") {
        drawWalls();
        drawText("ステージ選択", 32, 100);
        drawButtons();
        return;
      }

      // ここから先はワールド座標で描く（camX 分だけ左にずらす）
      ctx.save();
      ctx.translate(-camX, 0);

      drawGoal();

      // 障害物
      ctx.fillStyle = "#000";
      for (const o of obstacles) {
        if (o.shape === "circle") {
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
          ctx.fill();
        } else if (o.shape === "poly") {
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.rotate(o.a);
          ctx.beginPath();
          o.points.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.rotate(o.a);
          ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
          ctx.restore();
        }
      }

      // 黒い点（ゲームオーバー時は赤く）
      ctx.fillStyle = state === "gameover" ? "#d33" : "#000";
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, DOT_R, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      drawShip();
      drawWalls();

      // ステージ番号
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`STAGE ${stageIndex + 1}`, 20, 15);

      // ゴールまでの進み具合（ゲームオーバー画面でだけ表示する）
      const progress = Math.max(0, Math.min(1, (dot.x - 200) / (goalX - 200)));

      // スタート前のカウントダウン「3」「2」「1」と、スタート直後の「GO!」
      if (state === "countdown") {
        ctx.fillStyle = "rgba(244, 244, 239, 0.6)";
        ctx.fillRect(0, 0, W, H);
        drawText(`STAGE ${stageIndex + 1}`, 24, H / 2 - 80);
        drawText(String(Math.ceil(countdown / 60)), 120, H / 2 + 40);
      } else if (state === "playing" && goTimer > 0) {
        ctx.globalAlpha = Math.min(1, goTimer / 20); // だんだん消える
        drawText("GO!", 100, H / 2 + 35);
        ctx.globalAlpha = 1;
      }

      if (state === "gameover" || state === "clear") {
        ctx.fillStyle = "rgba(244, 244, 239, 0.75)";
        ctx.fillRect(0, 0, W, H);
        if (state === "gameover") {
          drawText("GAME OVER", 48, H / 2 - 30);
          drawText(`STAGE ${stageIndex + 1}  ${Math.floor(progress * 100)}%`, 20, H / 2 + 10);
        } else if (stageIndex < STAGES.length - 1) {
          drawText(`STAGE ${stageIndex + 1} CLEAR!`, 44, H / 2 - 20);
        } else {
          drawText("全ステージクリア！", 44, H / 2 - 20);
        }
        drawButtons();
      }
    }

    // 上下左の壁
    function drawWalls() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, WALL);
      ctx.fillRect(0, H - WALL, W, WALL);
      ctx.fillRect(0, 0, LEFT_WALL, H);
    }

    function drawText(text, size, y) {
      ctx.fillStyle = "#000";
      ctx.font = `bold ${size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(text, W / 2, y);
    }

    // ===== ゲームループ =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
