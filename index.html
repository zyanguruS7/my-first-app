<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スペースシューター</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      background: #000;
      border: 2px solid #444;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <script>
    // ===== 基本設定 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    // 押されているキーを記録する
    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space") e.preventDefault();
      // タイトル画面・ゲームオーバー画面でEnterを押すとスタート
      if (e.code === "Enter" && state !== "playing") startGame();
    });
    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    // ===== ゲームの状態 =====
    let state = "title"; // "title" / "playing" / "gameover"
    let player, bullets, enemies, particles, stars;
    let score, highScore = 0, frame, shootCooldown, invincible;

    // 背景の星（流れる演出用）
    stars = Array.from({ length: 80 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.5 + Math.random() * 2,
    }));

    function startGame() {
      player = { x: W / 2, y: H - 80, w: 30, h: 30, speed: 5, life: 3 };
      bullets = [];
      enemies = [];
      particles = [];
      score = 0;
      frame = 0;
      shootCooldown = 0;
      invincible = 0;
      state = "playing";
    }

    // ===== 更新処理 =====
    function update() {
      // 星を流す
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      }

      if (state !== "playing") return;
      frame++;

      // --- プレイヤーの移動 ---
      if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;
      if (keys["ArrowUp"] || keys["KeyW"]) player.y -= player.speed;
      if (keys["ArrowDown"] || keys["KeyS"]) player.y += player.speed;
      player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
      player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

      // --- 弾を撃つ ---
      if (shootCooldown > 0) shootCooldown--;
      if (keys["Space"] && shootCooldown === 0) {
        bullets.push({ x: player.x, y: player.y - 20, r: 4, speed: 9 });
        shootCooldown = 10;
      }
      for (const b of bullets) b.y -= b.speed;
      bullets = bullets.filter((b) => b.y > -10);

      // --- 敵の出現（スコアが上がるほど出やすく・速くなる）---
      const level = 1 + Math.floor(score / 500);
      const spawnRate = Math.max(15, 60 - level * 5);
      if (frame % spawnRate === 0) {
        const size = 20 + Math.random() * 20;
        enemies.push({
          x: size + Math.random() * (W - size * 2),
          y: -size,
          r: size / 2,
          speed: 1.5 + Math.random() * level,
          wobble: Math.random() * Math.PI * 2, // 左右に揺れる動き用
          hp: size > 32 ? 3 : 1,
        });
      }
      for (const e of enemies) {
        e.y += e.speed;
        e.wobble += 0.05;
        e.x += Math.sin(e.wobble) * 1.5;
      }

      // --- 弾と敵の当たり判定 ---
      for (const e of enemies) {
        for (const b of bullets) {
          if (b.hit) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
            b.hit = true;
            e.hp--;
            if (e.hp <= 0) {
              e.dead = true;
              score += e.r > 16 ? 30 : 10;
              explode(e.x, e.y, "#ff8844");
            }
          }
        }
      }
      bullets = bullets.filter((b) => !b.hit);

      // --- 敵とプレイヤーの当たり判定 ---
      if (invincible > 0) invincible--;
      for (const e of enemies) {
        if (e.dead) continue;
        if (invincible === 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + 12) {
          e.dead = true;
          player.life--;
          invincible = 90; // 約1.5秒の無敵時間
          explode(player.x, player.y, "#44ccff");
          if (player.life <= 0) {
            state = "gameover";
            highScore = Math.max(highScore, score);
          }
        }
      }
      enemies = enemies.filter((e) => !e.dead && e.y < H + 50);

      // --- 爆発エフェクト ---
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      }
      particles = particles.filter((p) => p.life > 0);
    }

    // 爆発のパーティクルを作る
    function explode(x, y, color) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30 + Math.random() * 20,
          color,
        });
      }
    }

    // ===== 描画処理 =====
    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      // 星
      ctx.fillStyle = "#888";
      for (const s of stars) ctx.fillRect(s.x, s.y, s.speed, s.speed);

      if (state === "title") {
        drawCenterText("スペースシューター", 40, H / 2 - 60, "#44ccff");
        drawCenterText("矢印キー / WASD：移動", 18, H / 2 + 10);
        drawCenterText("スペース：ショット", 18, H / 2 + 40);
        drawCenterText("Enterでスタート", 22, H / 2 + 100, "#ffdd44");
        return;
      }

      // プレイヤー（無敵中は点滅）
      if (invincible === 0 || Math.floor(invincible / 5) % 2 === 0) {
        ctx.fillStyle = "#44ccff";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 18);
        ctx.lineTo(player.x - 15, player.y + 15);
        ctx.lineTo(player.x, player.y + 8);
        ctx.lineTo(player.x + 15, player.y + 15);
        ctx.closePath();
        ctx.fill();
      }

      // 弾
      ctx.fillStyle = "#ffff66";
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 敵（大きい敵は紫、小さい敵は赤）
      for (const e of enemies) {
        ctx.fillStyle = e.r > 16 ? "#cc44ff" : "#ff4466";
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(e.x - e.r / 3, e.y - 2, 3, 3);
        ctx.fillRect(e.x + e.r / 3 - 3, e.y - 2, 3, 3);
      }

      // パーティクル
      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
      ctx.globalAlpha = 1;

      // スコア・ライフ表示
      ctx.fillStyle = "#fff";
      ctx.font = "18px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE: ${score}`, 10, 26);
      ctx.textAlign = "right";
      ctx.fillText("♥".repeat(Math.max(0, player.life)), W - 10, 26);

      if (state === "gameover") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, W, H);
        drawCenterText("GAME OVER", 44, H / 2 - 40, "#ff4466");
        drawCenterText(`スコア: ${score}`, 22, H / 2 + 10);
        drawCenterText(`ハイスコア: ${highScore}`, 18, H / 2 + 40);
        drawCenterText("Enterでリトライ", 22, H / 2 + 100, "#ffdd44");
      }
    }

    function drawCenterText(text, size, y, color = "#fff") {
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(text, W / 2, y);
    }

    // ===== ゲームループ =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
